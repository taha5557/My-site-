
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qattoush 🇲🇦</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 25px 18px 40px;
}

.top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 45px;
}

.circle-btn {
  width: 43px;
  height: 43px;
  border: 1px solid #333;
  border-radius: 50%;
  background: #151515;
  color: white;
  font-size: 20px;
}

.profile {
  text-align: center;
}

.avatar {
  width: 175px;
  height: 175px;
  margin: auto;
  padding: 5px;
  border-radius: 50%;
  background: linear-gradient(
    45deg, #ffb52e, #ff267d, #852bff, #168bff
  );
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
  border-radius: 50%;
  border: 4px solid #111;
}

h1 {
  margin-top: 20px;
  font-size: 29px;
}

.subtitle {
  color: #aaa;
  margin: 12px 0 25px;
  font-size: 17px;
}

.instagram {
  display: inline-block;
  color: white;
  font-size: 35px;
  text-decoration: none;
  margin-bottom: 35px;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 105px;
  padding: 12px;
  border-radius: 23px;
  background: linear-gradient(145deg,#202020,#151515);
  border: 1px solid #292929;
  text-decoration: none;
  color: white;
  transition: .2s;
}

.card:active {
  transform: scale(.97);
}

.card img {
  width: 76px;
  height: 76px;
  border-radius: 16px;
  object-fit: cover;
}

.card span {
  flex: 1;
  font-size: 16px;
  font-weight: bold;
  line-height: 1.7;
}

.arrow {
  color: #aaa;
  font-size: 27px;
}

.footer {
  text-align: center;
  margin-top: 30px;
  color: #777;
  font-size: 13px;
}

/* الوضع الفاتح */
body.light {
  background: #f4f4f4;
  color: #111;
}

body.light .card {
  background: white;
  color: #111;
  border-color: #ddd;
}

body.light .circle-btn {
  background: white;
  color: black;
}

body.light .instagram {
  color: black;
}
</style>
</head>

<body>

<div class="container">

  <div class="top">
    <button class="circle-btn">🐾</button>
    <button class="circle-btn" onclick="toggleTheme()">🌓</button>
  </div>

  <header class="profile">

    <div class="avatar">
      <img src="10.jpg" alt="قطوش">
    </div>

    <h1>Qattoush 🇲🇦</h1>

    <p class="subtitle">
      مغامرات قطوش 🐾
    </p>

    <a class="instagram"
       href="https://www.instagram.com/9toche/"
       target="_blank">
       ◎
    </a>

  </header>

  <section class="links">

    <a class="card"
       href="https://www.instagram.com/9toche/"
       target="_blank">
      <img src="in.jpg" alt="Instagram">
      <span>تابع مغامرات قطوش على إنستغرام</span>
      <b class="arrow">‹</b>
    </a>

    <a class="card"
       href="https://m.youtube.com/@9toche"
       target="_blank">
      <img src="yt.jpg" alt="YouTube">
      <span>شاهد أحدث فيديوهات قطوش على يوتيوب</span>
      <b class="arrow">‹</b>
    </a>



    <a class="card"
       href="https://www.tiktok.com/@9toche"
       target="_blank">
      <img src="tk.jpg" alt="TikTok">
      <span>تابع قطوش على تيك توك</span>
      <b class="arrow">‹</b>
    </a>

    <a class="card" href="game.html">
    <img src="gm.jpg" alt="game">
    <span>العاب قطوش</span>
    <b class="arrow">‹</b>
</a>
    
    <a class="card" href="apps.html">
    <img src="235402800_1794593144048740.jpg" alt="Apps">
    <span>تطبيقات قطوش 📱</span>
    <b class="arrow">‹</b>
</a>
    
  </section>

  <footer class="footer">
    Made with ❤️ for Qattoush 🇲🇦
  </footer>

</div>

<script>
function toggleTheme() {
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
