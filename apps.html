
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qattoush Apps 🇲🇦</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 25px 18px 40px;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.back {
    color: #ffad42;
    text-decoration: none;
    font-size: 16px;
}

h1 {
    text-align: center;
    margin-top: 45px;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin: 12px 0 30px;
}

.apps {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.app-card {
    background: linear-gradient(145deg,#202020,#151515);
    border: 1px solid #292929;
    border-radius: 20px;
    padding: 12px;
    text-align: center;
    color: white;
}

.app-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 14px;
}

.app-card h3 {
    margin: 12px 0 8px;
    font-size: 16px;
}

.app-card p {
    color: #aaa;
    font-size: 12px;
    line-height: 1.6;
    min-height: 38px;
}

.open {
    display: block;
    background: #ffad42;
    color: black;
    padding: 10px;
    margin-top: 12px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    font-size: 13px;
}

.footer {
    text-align: center;
    margin-top: 40px;
    color: #777;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<header>
    <a class="back" href="index.html">‹ رجوع</a>
    <b>🐾 Qattoush</b>
</header>

<h1>تطبيقات قطوش 📱</h1>
<p class="subtitle">اكتشف عالم تطبيقات قطوش 🇲🇦</p>

<section class="apps">
  

</section>

<footer class="footer">
    Made with ❤️ for Qattoush 🇲🇦
</footer>

</div>

</body>
</html>
